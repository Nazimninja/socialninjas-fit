<style>
  /* ── SPLASH SCREEN ── */
  #fn-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #07090e;
    background-image:
      radial-gradient(900px circle at 50% 30%, rgba(56,189,248,0.13) 0%, transparent 70%),
      radial-gradient(500px circle at 80% 70%, rgba(56,189,248,0.06) 0%, transparent 60%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  #fn-splash.fn-splash-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  @keyframes fn-logo-pulse {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(56,189,248,0.55)); transform: scale(1); }
    50%       { filter: drop-shadow(0 0 32px rgba(56,189,248,0.85)); transform: scale(1.04); }
  }
  #fn-splash-logo {
    width: 84px;
    height: 84px;
    -o-object-fit: contain;
       object-fit: contain;
    animation: fn-logo-pulse 2.4s ease-in-out infinite;
    margin-bottom: 22px;
  }

  #fn-splash-brand {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.8px;
    color: #ffffff;
    margin-bottom: 4px;
    line-height: 1;
  }
  #fn-splash-brand span {
    background: linear-gradient(135deg, #38bdf8 0%, #bae6fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #fn-splash-sub {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #475569;
    margin-bottom: 44px;
  }

  @keyframes fn-spin {
    to { transform: rotate(360deg); }
  }
  #fn-splash-spinner {
    width: 40px;
    height: 40px;
    position: relative;
  }
  #fn-splash-spinner svg {
    animation: fn-spin 0.9s linear infinite;
    width: 40px;
    height: 40px;
  }

  #fn-splash-tagline {
    position: absolute;
    bottom: 36px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: #334155;
    letter-spacing: 0.3px;
  }
</style>

<body style="margin:0;background:#07090e;color:#fff;">

<div id="fn-splash">
  <img id="fn-splash-logo" src="/favicon.svg" alt="Fit Ninja" onerror="this.src='/favicon.png'">
  <div id="fn-splash-brand">Fit <span>Ninja v2</span></div>
  <div id="fn-splash-sub">Next-Gen Intelligence &amp; 4,100+ Exercises</div>
  <div id="fn-splash-spinner">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="16" stroke="rgba(56,189,248,0.15)" stroke-width="3"/>
      <path d="M20 4 A16 16 0 0 1 36 20" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <div id="fn-splash-tagline">by Social Ninja's · Unified Master Brain</div>
</div>

<div id="root"></div>

<script>
  (function() {
    var splash = document.getElementById('fn-splash');
    if (!splash) return;
    var maxTimer = setTimeout(function() {
      splash.classList.add('fn-splash-out');
      setTimeout(function(){ splash.remove(); }, 400);
    }, 4000);
    var obs = new MutationObserver(function() {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        obs.disconnect();
        clearTimeout(maxTimer);
        setTimeout(function() {
          splash.classList.add('fn-splash-out');
          setTimeout(function(){ splash.remove(); }, 380);
        }, 120);
      }
    });
    obs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
  })();
</script>
</body>
